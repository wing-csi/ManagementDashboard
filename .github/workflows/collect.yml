name: collect

on:
  schedule:
    - cron: '0 21 * * *' # 每日 05:00 HKT
  push:
    branches: [main]
    paths: ['config.toml', 'scripts/**', 'docs/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          # pytest-playwright(唔係淨係 playwright)先會提供 `page` fixture —
          # 冇佢嘅話 docs/ 嘅前端 guard 會靜靜哋 skip 晒
          pip install pytest pyyaml pytest-playwright -q
          python3 -m playwright install --with-deps chromium
          python3 -m pytest scripts/ -q

      - name: Collect metrics
        # 個 id 係俾下面 Cloudflare deploy 嗰步引用 —— 佢要分得出「collector
        # 出咗事」同「data repo 出咗事」,前者唔可以 deploy,後者照 deploy。
        id: collect
        env:
          # 讀其他 private repo 需要 PAT;冇設定 secret 就 fallback 用
          # 預設 token(只夠讀 public repos 同本 repo)
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN || github.token }}
          # per-repo tokens(config token_env 對應):secrets 唔會自動變 env,
          # 每加一個 token 都要喺度加一行
          BEN_GH_METRICS_TOKEN: ${{ secrets.BEN_GH_METRICS_TOKEN }}
        run: python3 scripts/collect_github.py --config config.toml --out /tmp/metrics.json

      - name: Checkout private data repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: wing-csi/ManagementDashboard-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-repo

      - name: Publish metrics to private data repo
        if: github.event_name != 'pull_request'
        working-directory: data-repo
        run: |
          cp /tmp/metrics.json metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --staged --quiet; then
            echo "metrics unchanged — nothing to publish"
          else
            git commit -m "chore: update metrics"
            git push
          fi

      # 兩個去向要各自死得 —— 私有 data repo 同 Cloudflare Pages 係互為 fallback。
      # 用 GitHub 預設嘅 success() 閘就唔係:DATA_REPO_PAT 一過期,上面個 checkout
      # 就跌,之後每一步一律 skip,而個 Pages 站會靜靜哋繼續派返上一次 deploy 嘅
      # 數字 —— Actions 度係紅色,但冇人望 Actions,個 dashboard 表面亦都睇唔出
      # 啲數係舊嘅。
      #
      # !cancelled() 令呢步唔再繼承前面嘅失敗;但淨係咁就太鬆 —— collector 自己
      # 爆咗都會照 deploy,派一份殘缺或者舊嘅 /tmp/metrics.json 當今日嘅數。所以
      # 再加一條:collect 嗰步一定要成功。對 data repo 有韌性,唔等於對數據求其。
      - name: Deploy dashboard to Cloudflare Pages
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — cannot deploy to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set — cannot deploy to Cloudflare Pages"
            exit 1
          fi
          cp /tmp/metrics.json docs/data/metrics.json
          npx --yes wrangler@4 pages deploy docs --project-name=management-dashboard --branch=main
