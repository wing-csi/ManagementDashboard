name: collect

on:
  schedule:
    - cron: '0 21 * * *' # 每日 05:00 HKT
  push:
    branches: [main]
    paths: ['config.toml', 'scripts/**', 'docs/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          pip install pytest pyyaml -q
          python3 -m pytest scripts/ -q

      - name: Collect metrics
        env:
          # 讀其他 private repo 需要 PAT;冇設定 secret 就 fallback 用
          # 預設 token(只夠讀 public repos 同本 repo)
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN || github.token }}
          # per-repo tokens(config token_env 對應):secrets 唔會自動變 env,
          # 每加一個 token 都要喺度加一行
          BEN_GH_METRICS_TOKEN: ${{ secrets.BEN_GH_METRICS_TOKEN }}
        run: python3 scripts/collect_github.py --config config.toml --out /tmp/metrics.json

      - name: Checkout private data repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: wing-csi/ManagementDashboard-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-repo

      - name: Publish metrics to private data repo
        if: github.event_name != 'pull_request'
        working-directory: data-repo
        run: |
          cp /tmp/metrics.json metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --staged --quiet; then
            echo "metrics unchanged — nothing to publish"
          else
            git commit -m "chore: update metrics"
            git push
          fi

      - name: Deploy dashboard to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — cannot deploy to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set — cannot deploy to Cloudflare Pages"
            exit 1
          fi
          cp /tmp/metrics.json docs/data/metrics.json
          npx --yes wrangler@4 pages deploy docs --project-name=management-dashboard --branch=main
